<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SSU HUD</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #141922;
    --line: #262c38;
    --dim: #8b95a7;
    --faint: #6f7a8c;
    --text: #eef2f7;
    --good: #3ddc97;
    --warn: #ffb020;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { padding: 12px; display: flex; align-items: center; }
  .card { width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .label { font-size: 11px; color: var(--dim); letter-spacing: .02em; }
  .value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pct { font-size: 11px; font-variant-numeric: tabular-nums; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 6px; }
  .model { font-size: 10px; color: var(--faint); margin-left: auto; max-width: 40%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .track { height: 5px; border-radius: 3px; background: #1e232d; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 3px; background: var(--good); transition: width .3s ease; }
  .foot { margin-top: 8px; font-size: 10px; color: var(--faint); display: flex; gap: 14px;
    font-variant-numeric: tabular-nums; }
  .err { color: var(--warn); }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <span class="label">크레딧</span>
    <span class="value" id="credits">-</span>
    <span class="pct" id="credits-pct"></span>
    <span class="sep"></span>
    <span class="label">컨텍스트</span>
    <span class="value" id="ctx">-</span>
    <span class="model" id="model"></span>
  </div>
  <div class="bars">
    <div class="track"><div class="fill" id="credits-bar"></div></div>
    <div class="track"><div class="fill" id="ctx-bar"></div></div>
  </div>
  <div class="foot">
    <span id="session"></span>
    <span id="cached"></span>
    <span id="usage"></span>
    <span id="headroom"></span>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat("ko-KR");
  const short = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
  const color = (left) => (left < 10 ? "--bad" : left < 30 ? "--warn" : "--good");
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function paint(bar, pct, left) {
    const p = Math.max(0, Math.min(100, pct));
    bar.style.width = p + "%";
    bar.style.background = css(color(left));
  }

  async function tick() {
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      const d = await r.json();
      const c = d.credits || {};
      const x = d.context || {};

      if (c.ok) {
        $("credits").textContent = nf.format(Math.round(c.remaining)) + " / " + nf.format(Math.round(c.quota));
        $("credits-pct").textContent = "(" + c.pct.toFixed(1) + "%)";
        $("credits-pct").style.color = css(color(c.pct));
        paint($("credits-bar"), c.pct, c.pct);
      } else {
        $("credits").textContent = "-";
        $("credits-pct").textContent = c.error === "no key" ? "키 없음" : "조회 실패";
        $("credits-pct").className = "pct err";
      }

      if (x.ok) {
        $("model").textContent = x.model;
        if (x.limit > 0) {
          $("ctx").textContent = short(x.context) + " / " + short(x.limit);
          paint($("ctx-bar"), x.pct, 100 - x.pct);
        } else {
          $("ctx").textContent = short(x.context) + " tokens";
          paint($("ctx-bar"), 0, 100);
        }
        $("session").textContent = "세션 " + String(x.session).slice(0, 12);
        $("cached").textContent = "캐시 " + short(x.cached);
      } else {
        $("ctx").textContent = "-";
        $("cached").textContent = x.error || "";
      }
      const u = d.usage || {};
      if (u.ok) {
        $("usage").textContent = "누적 " + short(u.total) + " 토큰 · 캐시 적중 " + u.cacheRatio.toFixed(1) + "%";
      }
      $("headroom").textContent = new Date(d.at).toLocaleTimeString("ko-KR");
    } catch (e) {
      $("headroom").textContent = "HUD 서버 연결 끊김";
    }
  }
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
